name: sifit
services:
  backend:
    image: sifit-backend:${RELEASE_TAG:-local}
    build:
      context: ..
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      SOCKET_CORS_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: sifit-web:${RELEASE_TAG:-local}
    build:
      context: ../../sifit-prototype
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DEMO_MODE: "true"
    environment:
      SITE_ADDRESS: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
